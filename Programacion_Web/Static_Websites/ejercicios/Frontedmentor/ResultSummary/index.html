<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result summary</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="box">
        <div class="card__result">
            <h4>Your Result</h4>
            <div class="result">
                <span class="total">76</span> of 100
            </div>
            <h3>Great</h3>
            <p class="text">
                You scored higher than 65% of the people who have taken these test
            </p>
        </div>
        <div class="card__summary">
            <h4 class="summary">Summary</h4>
            <div class="stats">
                <div class="summary--item">
                    <span class="reaction">
                        <img src="./assets/lightning.png" alt="reaction icon">
                        Reaction
                    </span> 80 / 100
                </div>
                <div class="summary--item">
                    <span class="memory">
                        <img src="./assets/clock.png" alt="memory icon">
                        Memory
                    </span> 92 / 100
                </div>
                <div class="summary--item">
                    <span class="verbal">
                        <img src="./assets/message.png" alt="verbal icon">
                        Verbal
                    </span> 61 / 100
                </div>
                <div class="summary--item">
                    <span class="visual">
                        <img src="./assets/visual.png" alt="visual icon">
                        Visual
                    </span> 72 / 100
                </div>
            </div>
            <button>Continue</button>
        </div>
    </div>
</body>

</html>
